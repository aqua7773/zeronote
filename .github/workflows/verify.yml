name: verify

# P3-3 落地：把本机的五步验收搬进 CI —— 每次 push / PR 都跑，不靠人记得。
# 与 scripts/verify.ps1 对齐：tsc 0 错误 · oxlint 0 error · cargo test --lib · check-docs · vitest 全过。
# 用 windows-latest：本机是 Windows / MSVC，cargo test --lib 在这里最贴近真实编译环境。

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # 顺序不能反：setup-node@v5 默认会按 packageManager 缓存依赖，
      # 它执行时 pnpm 必须已经在 PATH 里（rev130 实测：先 setup-node 会报 "Unable to locate pnpm"）。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (tsc -b)
        run: pnpm exec tsc -b

      - name: Lint (oxlint src)
        run: pnpm exec oxlint src

      - name: Unit tests (vitest)
        run: pnpm exec vitest run

      - name: Docs consistency (check-docs)
        run: node scripts/check-docs.mjs

      - name: Arch direction (check-arch)
        run: node scripts/check-arch.mjs

      - name: Local links (check-links)
        run: node scripts/check-links.mjs

      - name: Catalog freshness (gen-catalog --check)
        run: node scripts/gen-catalog.mjs --check

      - name: Keymap freshness (gen-keys --check)
        run: node scripts/gen-keys.mjs --check

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo test (src-tauri)
        working-directory: src-tauri
        run: cargo test --lib
