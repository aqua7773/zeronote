[package]
name = "zeronote"
version = "0.2.0"
description = "ZeroNote —— 空内核的本地 Markdown 笔记应用"
authors = ["aqua"]
license = "MIT"
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "zeronote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-statusbar = { path = "plugins/tauri-plugin-statusbar" }
# 通知捕获（rev173.16）：Android NotificationListenerService → 缓存 → 记账插件解析
tauri-plugin-notification-capture = { path = "plugins/tauri-plugin-notification-capture" }
# 请求 Android「所有文件访问」权限（库放公共存储时必需；系统不弹窗，只能手动开）
tauri-plugin-androidperm = { path = "plugins/tauri-plugin-androidperm" }
# 读 Android SAF 的 content:// URI（系统「打开方式」递来的文件；std::fs 读不了它）
tauri-plugin-uri-reader = { path = "plugins/tauri-plugin-uri-reader" }

# 文件关联（桌面）：Windows 上「双击 .md」第二次启动的进程要把参数**转发**给已在运行的实例
# —— 见 lib.rs 的 `forward_open_targets`。
#
# ⚠️ 必须放在 target 专属依赖里：该 crate 源码第一行就是
# `#![cfg(not(any(target_os = "android", target_os = "ios")))]`，
# Android 上整个 crate 是空的（引用它的 `init()` 会编译失败）。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

# WebView2 设置（仅 Windows）：关闭**浏览器加速键**（Ctrl+F 原生查找栏 / Ctrl+R / F5…）
# —— 见 lib.rs 的 `disable_browser_accelerator_keys`。Android 没有 WebView2，整段 cfg 掉。
# ⚠️ 版本必须与 tauri 2.12.3 内部用的一致（webview2-com 0.39 + windows-core 0.62），
#    否则接口类型是两份不同的 COM 定义，`cast` 会编译失败。
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
