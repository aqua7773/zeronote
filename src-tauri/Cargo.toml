[package]
name = "zeronote"
version = "0.9.0"
description = "ZeroNote —— 空内核的本地 Markdown 笔记应用"
authors = ["aqua"]
license = "MIT"
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "zeronote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# 插件签名验签（rev173.77 · 契约 §7.4）：Ed25519 纯 Rust 实现，桌面 / Android 行为一致
# —— 不用 Web Crypto 是因为旧 Android WebView 不一定有 `Ed25519` 算法。
ed25519-dalek = "2"
base64 = "0.22"
# 市场下载的整包校验（rev173.148）：索引记的 sha256 与下载到的字节必须在**同一侧**比对。
# 已在依赖树里（ed25519-dalek 的传递依赖）⇒ 不增加新的编译量。
sha2 = "0.10"
# 图片压缩（rev173.233 · 附件同步期 2）：插入图片时按需压到 1 MiB 以下。
# 只开要用的格式 —— 默认 features 会把 avif(ravif) / exr / hdr / ico / pnm / qoi / tga
# 全编进来（多几十个 crate、CI 明显变慢），而插入场景只需要 jpeg / png / webp。
# png 本来就在依赖树里（arboard 用），这里真正新增的只有 zune-jpeg + image-webp。
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
tauri = { version = "2.12.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
# 原生剪贴板（rev173.92）：WebView 的 `clipboard-read` 固定 denied（实测），
# 「从别的 App 复制 → 粘贴进 ZeroNote」只能走原生命令（Android 用 ClipboardManager）。
tauri-plugin-clipboard-manager = "2"
tauri-plugin-statusbar = { path = "plugins/tauri-plugin-statusbar" }
# 通知捕获（rev173.16）：Android NotificationListenerService → 缓存 → 记账插件解析
tauri-plugin-notification-capture = { path = "plugins/tauri-plugin-notification-capture" }
# 请求 Android「所有文件访问」权限（库放公共存储时必需；系统不弹窗，只能手动开）
tauri-plugin-androidperm = { path = "plugins/tauri-plugin-androidperm" }
# 读 Android SAF 的 content:// URI（系统「打开方式」递来的文件；std::fs 读不了它）
tauri-plugin-uri-reader = { path = "plugins/tauri-plugin-uri-reader" }
# J#13（rev173.281）：系统分享（Android ACTION_SEND 纯文本；桌面返回 desktop-no-share）
tauri-plugin-share = { path = "plugins/tauri-plugin-share" }
# 系统凭据库（同步插件凭据 · 2026-10-24 用户裁决「一开始就走钥匙串」）：
# Windows Credential Manager / Android Keystore + SharedPreferences / macOS Keychain。
# 关掉 crypto feature —— 内核只要「存 / 取一段字符串」，不要它的 SLIP10/BIP39/Ed25519。
tauri-plugin-keyring-store = { version = "0.2", default-features = false }

# 文件关联（桌面）：Windows 上「双击 .md」第二次启动的进程要把参数**转发**给已在运行的实例
# —— 见 lib.rs 的 `forward_open_targets`。
#
# ⚠️ 必须放在 target 专属依赖里：该 crate 源码第一行就是
# `#![cfg(not(any(target_os = "android", target_os = "ios")))]`，
# Android 上整个 crate 是空的（引用它的 `init()` 会编译失败）。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
# 文件监听（rev173.59）：桌面走系统级 watcher（Windows ReadDirectoryChangesW /
# macOS FSEvents / Linux inotify），改盘即发 `zn://fs-change`。
# ⚠️ 移动端**不装**：Android 的 /storage/emulated/0 是 FUSE 挂载，inotify 漏报是常态，
#    前端在手机上退回 3 秒轮询（见 lib.rs `watch_vault` 的返回）。
notify = "8"
# 窗口位置 / 大小记忆（rev173.61）：只跟踪主窗口（lib.rs 的 `with_filter`）。
# 官方 README 标注 Android / iOS 不支持 ⇒ 同样只挂桌面段。
tauri-plugin-window-state = "2"

# WebView2 设置（仅 Windows）：关闭**浏览器加速键**（Ctrl+F 原生查找栏 / Ctrl+R / F5…）
# —— 见 lib.rs 的 `disable_browser_accelerator_keys`。Android 没有 WebView2，整段 cfg 掉。
# ⚠️ 版本必须与 tauri 2.12.3 内部用的一致（webview2-com 0.39 + windows-core 0.62），
#    否则接口类型是两份不同的 COM 定义，`cast` 会编译失败。
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
# Windows Hello（rev173.169）：KeyCredentialManager + 带窗口 interop（hello.rs 手写 vtable）。
# 0.62 与 tauri 内部用的一致（Cargo.lock 里本来就是 0.62.2，只加 feature 不引入新版本）。
windows = { version = "0.62", features = [
  "Foundation",
  "Security_Credentials",
  "Security_Cryptography",
  "Storage_Streams",
] }
# `IAsyncOperation` 不住在 windows crate 里（0.62 起挪到 windows-future），
# 而 KeyCredentialManager 的每个调用都返回它 ⇒ 必须直接依赖才能标注类型 / await。
windows-future = { version = "0.3", features = ["std"] }
# hello.rs 用 block_on 等 WinRT 的 IAsyncOperation（COM 接口不是 Send，不能跨 await）
futures = "0.3"

# HTTP 原语（`net` · rev173.106）：WebDAV 同步靠它，必须**在 Rust 侧发请求**——
# WebView 里直连会被 CORS 拦死（PROPFIND/PUT 必然触发 preflight，见方案文档 §3 缺口 1）。
#
# TLS 后端按平台分：桌面走系统栈（Windows schannel / macOS Security.framework），
# 零额外编译依赖、自动用系统证书；Android 没有系统 TLS 的 Rust 绑定，改走
# rustls + ring（纯 Rust，NDK 能编，不碰 OpenSSL/NDK 里的 openssl-sys）。
[target.'cfg(not(target_os = "android"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = [
  "native-tls",
  "http2",
  "charset",
] }

[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.13", default-features = false, features = [
  "rustls-no-provider",
  "http2",
  "charset",
] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# 内置 Mozilla 根证书（rev173.108 真机实测加的）：`rustls-no-provider` 默认的验证器是
# `rustls-platform-verifier`，它要经 JNI 调 Android TrustManager —— 没人初始化它时
# **HTTPS 请求会永远 pending**（实测：http 200 / https 挂死，连超时都不触发）。
# 换成内置根证书后不依赖平台验证器，也顺带让行为在两端一致。
webpki-roots = "1"
# 生物识别（期 2b 前置验证）：官方插件只挂 Android 目标，桌面构建不引入该 crate。
# 2.5.0 = v2 分支当前最新（2026-10-14），Android 提供 status / authenticate / biometricCipher。
tauri-plugin-biometric = "2.5.0"

# 图片编解码是 CPU 密集的，而 dev 构建默认 opt-level = 0（全不优化）——
# 实测 dev 下处理一张 19 MB / 5000×3500 的图要几十秒，用户插入时像卡死（rev173.233）。
# 只给这几个 crate 开优化，不动全项目的 dev 配置（全开会让每次 `cargo build` 慢一倍）。
# release 构建本来就优化，这里只影响 dev / CI 的 debug 产物。
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.image-webp]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
