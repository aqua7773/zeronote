# 手写 —— 本插件用 `tauri::plugin::Builder`（非 `tauri_plugin::Builder`），没有 build.rs 代为生成。
# 与同目录 `read_content_uri.toml` 逐字同构。缺它 ⇒ 编译期：
#   error: proc macro panicked —— failed to resolve ACL:
#   SetPermissionNotFound { permission: "allow-write-content-uri", set: "default" }
# （2026-10-15 真踩：加了命令 + default.toml 里引用，但没补这份 autogenerated ⇒ 整轮 Android 构建挂掉）

"$schema" = "../../schemas/schema.json"

[[permission]]
identifier = "allow-write-content-uri"
description = "Enables the write_content_uri command without any pre-configured scope."
commands.allow = ["write_content_uri"]

[[permission]]
identifier = "deny-write-content-uri"
description = "Denies the write_content_uri command without any pre-configured scope."
commands.deny = ["write_content_uri"]
