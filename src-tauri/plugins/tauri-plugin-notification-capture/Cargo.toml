[package]
name = "tauri-plugin-notification-capture"
version = "0.1.0"
description = "ZeroNote: 捕获 Android 通知（支付/银行短信），缓存给记账插件解析"
authors = ["AQUA"]
license = "MIT"
edition = "2021"
build = "build.rs"
links = "tauri-plugin-notification-capture"

[lib]
name = "tauri_plugin_notification_capture"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.3" }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
