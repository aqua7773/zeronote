"$schema" = "schemas/schema.json"

[default]
description = """ZeroNote Android 权限插件：请求「所有文件访问」（MANAGE_EXTERNAL_STORAGE）。

为什么需要它：把笔记库放在**公共存储**（如 /storage/emulated/0/Documents/ZeroNote）时，
应用必须拿到这个权限才能读写库文件与插件。它是 Android 的**特殊权限，系统不会弹窗申请** ——
只能在设置里手动开。没有这个权限时的表现是 `Permission denied (os error 13)`，
用户完全不知道该去开什么（rev64 的真实教训）。

本命令只做一件事：**跳转到该权限的系统授权页**（带 package 直达本应用那一页）。"""
permissions = ["allow-request-all-files-access"]
