[package]
name = "tauri-plugin-crashlog"
version = "0.1.0"
description = "ZeroNote: 读取上次崩溃的 trace（Android ApplicationExitInfo），供用户一键复制反馈"
authors = ["AQUA"]
license = "MIT"
edition = "2021"
build = "build.rs"
links = "tauri-plugin-crashlog"

[lib]
name = "tauri_plugin_crashlog"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.3" }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
