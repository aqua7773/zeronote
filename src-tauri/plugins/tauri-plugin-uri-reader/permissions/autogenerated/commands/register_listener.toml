# 手写 —— 本插件用 `tauri::plugin::Builder`（非 `tauri_plugin::Builder`），没有 build.rs 代为生成。
# 与官方 tauri-plugin-notification-2.4.0 的 autogenerated/commands/register_listener.toml 逐字同构。
# 缺它 ⇒ 编译期 `failed to resolve ACL: SetPermissionNotFound { permission: "allow-register-listener" }`。

"$schema" = "../../schemas/schema.json"

[[permission]]
identifier = "allow-register-listener"
description = "Enables the register_listener command without any pre-configured scope."
commands.allow = ["register_listener"]

[[permission]]
identifier = "deny-register-listener"
description = "Denies the register_listener command without any pre-configured scope."
commands.deny = ["register_listener"]
