"$schema" = "schemas/schema.json"

[default]
description = """ZeroNote 分享插件：把一段**纯文本**或**一个文件**交给 Android 系统分享面板
（`Intent.ACTION_SEND`；文件走 FileProvider 的 `content://`）—— 微信 / QQ / 邮件 / 备忘录都能接收。

桌面端**没有系统分享**，调用会返回 `desktop-no-share` 错误（调用方据此改走剪贴板），
不做静默成功。"""
permissions = ["allow-share-text", "allow-share-file"]
