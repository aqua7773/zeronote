[package]
name = "tauri-plugin-statusbar"
version = "0.1.0"
description = "ZeroNote: 按需隐藏/显示 Android 状态栏（导航栏不受影响）"
authors = ["AQUA"]
license = "MIT"
edition = "2021"
build = "build.rs"
links = "tauri-plugin-statusbar"

[lib]
name = "tauri_plugin_statusbar"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.3" }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
