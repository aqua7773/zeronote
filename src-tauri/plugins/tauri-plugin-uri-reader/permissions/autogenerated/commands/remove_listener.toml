# 手写 —— 理由同 register_listener.toml。
# 缺它 ⇒ 编译期 `failed to resolve ACL: SetPermissionNotFound { permission: "allow-remove-listener" }`。

"$schema" = "../../schemas/schema.json"

[[permission]]
identifier = "allow-remove-listener"
description = "Enables the remove_listener command without any pre-configured scope."
commands.allow = ["remove_listener"]

[[permission]]
identifier = "deny-remove-listener"
description = "Denies the remove_listener command without any pre-configured scope."
commands.deny = ["remove_listener"]
