"$schema" = "schemas/schema.json"

[default]
description = """ZeroNote URI 读取插件：允许前端把 Android 系统递来的 `content://`（SAF）文件
读成应用缓存里的一份临时文件（返回 { path, name }），或把内容**写回**用户选定的 `content://`。

用途：① 从文件管理器「用 ZeroNote 打开」**其他目录**里的 md / pdf —— Rust 的 std::fs 读不了
content://，只有 Android 的 ContentResolver 能；② 导出（另存为）时把内容写进 SAF 给的 URI。"""
permissions = ["allow-read-content-uri", "allow-write-content-uri", "allow-register-listener", "allow-remove-listener"]
